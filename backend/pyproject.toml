[project]
name = "baribhara-backend"
version = "0.1.0"
description = "BariBhara API: rent, flat, tenant and maintenance management for small Dhaka landlords"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
